<section id="skills" class="section skills-section">
  <div class="orb" style="width:350px;height:350px;background:rgba(6,182,212,0.06);top:0;right:0;"></div>
  <div class="container">
    <div class="section-header fade-in">
      <p class="section-label">Tech Stack</p>
      <h2 class="section-title">Skills & Tools</h2>
      <p class="section-sub">Technologies I work with daily.</p>
    </div>

    <div class="skills-grid">
      <div class="skill-category card fade-in"
           *ngFor="let cat of categories; let i = index"
           [style.transition-delay]="(i * 0.1) + 's'">
        <div class="cat-header">
          <span class="cat-icon mono" [class]="'color-' + cat.color">{{ cat.icon }}</span>
          <h3 class="cat-name">{{ cat.name }}</h3>
        </div>
        <div class="skill-bars">
          <div class="skill-bar-item" *ngFor="let skill of cat.skills">
            <div class="skill-bar-top">
              <span class="skill-name">{{ skill.name }}</span>
              <span class="skill-level mono">{{ skill.level }}%</span>
            </div>
            <div class="skill-bar-track">
              <div class="skill-bar-fill"
                   [class]="'fill-' + cat.color"
                   [style.width]="animateSkills ? skill.level + '%' : '0%'">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
