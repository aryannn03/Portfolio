<section id="projects" class="section proj-section">
  <div class="orb" style="width:400px;height:400px;background:rgba(139,92,246,0.06);bottom:0;left:-100px;"></div>
  <div class="container">
    <div class="section-header fade-in">
      <p class="section-label">Portfolio</p>
      <h2 class="section-title">Featured Projects</h2>
      <p class="section-sub">Things I've built — from zero to deployed.</p>
    </div>

    <div class="projects-grid">
      <div class="project-card card fade-in"
           *ngFor="let p of projects; let i = index"
           [class.featured]="p.featured"
           [attr.data-color]="p.color"
           [style.transition-delay]="(i * 0.15) + 's'">

        <div class="project-glow" [class]="'glow-' + p.color"></div>

        <div class="project-header">
          <div class="project-icon-wrap" [class]="'icon-' + p.color">
            <span class="project-icon">{{ p.icon }}</span>
          </div>
          <div class="project-period mono">{{ p.period }}</div>
        </div>

        <h3 class="project-title">{{ p.title }}</h3>
        <p class="project-subtitle" [class]="'gradient-text-' + (p.color === 'cyan' ? 'blue' : p.color)">{{ p.subtitle }}</p>

        <p class="project-desc">{{ p.description }}</p>
        <div class="project-preview">
  <img
    [src]="p.screenshots[activeScreenshot[i]].src"
    [alt]="p.title"
    class="project-image"
  />

  <div class="preview-dots">
    <span
      *ngFor="let ss of p.screenshots; let s = index"
      class="dot"
      [class.active]="activeScreenshot[i] === s"
      (click)="setScreenshot(i, s)">
    </span>
  </div>
</div>

        <ul class="project-highlights">
          <li *ngFor="let h of p.highlights">
            <span class="highlight-dot"></span>{{ h }}
          </li>
        </ul>

        <div class="project-tech">
          <span class="tech-badge" *ngFor="let t of p.tech">{{ t }}</span>
        </div>

        <div class="project-footer">
          <a [href]="p.github" target="_blank" class="project-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
            View Code
          </a>
          <span class="project-featured" *ngIf="p.featured">⭐ Featured</span>
        </div>
      </div>
    </div>
  </div>
</section>
